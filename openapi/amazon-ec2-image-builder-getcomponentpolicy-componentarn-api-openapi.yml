security:
- hmac: []
tags:
- name: GetComponentPolicy#componentArn
paths:
  /GetComponentPolicy#componentArn:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: GetComponentPolicy
      description: Gets a component policy.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetComponentPolicyResponse'
              examples:
                GetComponentPolicy200Example:
                  summary: Default GetComponentPolicy 200 response
                  x-microcks-default: true
                  value:
                    requestId: example-id-1234
                    policy: example-string
        '480':
          description: ServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceException'
              examples:
                GetComponentPolicy480Example:
                  summary: Default GetComponentPolicy 480 response
                  x-microcks-default: true
                  value: {}
        '481':
          description: ServiceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableException'
              examples:
                GetComponentPolicy481Example:
                  summary: Default GetComponentPolicy 481 response
                  x-microcks-default: true
                  value: {}
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '484':
          description: ForbiddenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenException'
        '485':
          description: CallRateLimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRateLimitExceededException'
      parameters:
      - name: componentArn
        in: query
        required: true
        description: The Amazon Resource Name (ARN) of the component whose policy you want to retrieve.
        schema:
          type: string
          pattern: ^arn:aws[^:]*:imagebuilder:[^:]+:(?:[0-9]{12}|aws):component/[a-z0-9-_]+/[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$
      summary: Amazon EC2 Image Builder Get Component Policy
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - GetComponentPolicy#componentArn
components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    InvalidRequestException: {}
    ServiceException: {}
    CallRateLimitExceededException: {}
    GetComponentPolicyResponse:
      type: object
      properties:
        requestId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The request ID that uniquely identifies this request.
          example: example-id-1234
        policy:
          allOf:
          - $ref: '#/components/schemas/ResourcePolicyDocument'
          - description: The component policy.
          example: example-string
    NonEmptyString:
      type: string
      minLength: 1
      maxLength: 1024
    ResourceNotFoundException: {}
    ServiceUnavailableException: {}
    ResourcePolicyDocument:
      type: string
      minLength: 1
      maxLength: 30000
    ForbiddenException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
